name: Deploy gomoku-online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published source and strip platform wrapper
        env:
          SRC: https://4m8z63zavtzhk.doubao.link/app/app_17ht1detbmm
        run: |
          curl -sSL --max-time 60 "$SRC" -o page.html
          python3 tools/strip.py
          sha=$(sha256sum site/index.html | awk '{print $1}')
          echo "sha256=$sha"
          test "$sha" = "32bb672a7210c1d78cd96a61647b1187ccfbc9278fc428e0aebca42a97d59471"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
