name: Build site from published source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published source and strip platform wrapper
        env:
          SRC: https://4m8z63zavtzhk.doubao.link/app/app_17ht1detbmm
        run: |
          curl -sSL --max-time 60 "$SRC" -o page.html
          python3 tools/strip.py
          cp site/index.html index.html
          sha=$(sha256sum index.html | awk '{print $1}')
          echo "sha256=$sha"
          test "$sha" = "32bb672a7210c1d78cd96a61647b1187ccfbc9278fc428e0aebca42a97d59471"

      - name: Commit rebuilt index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged"
          else
            git commit -m "Rebuild index.html from published source"
            git push
          fi
